services:
  - type: web
    name: dhikr-counter
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional: a server-side provider key so the browser never holds one.
      # Leave blank to only allow keys entered in the AI studio on the device.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-2.5-flash
      # Optional: comma-separated origins of a static frontend allowed to use this
      # service as its AI proxy (for example https://dhikr-counter.onrender.com).
      - key: AI_PROXY_ORIGINS
        sync: false
