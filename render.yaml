services:
  - type: web
    name: dhikr-counter
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Required to enable the hidden admin panel. Unset = panel disabled and
      # /api/ai/chat refuses all requests, so the AI key cannot be spent.
      - key: ADMIN_PASSCODE
        sync: false
      # Required PostgreSQL connection (Neon recommended). The server applies
      # migrations/001_push_subscriptions.sql automatically when it connects.
      - key: DATABASE_URL
        sync: false
      # Web Push credentials must be generated once and kept stable across deploys.
      # Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # Optional: how long an admin login lasts before it expires (hours, max 168).
      - key: ADMIN_SESSION_HOURS
        value: "12"
      # Optional: a server-side provider key so the browser never holds one.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-2.5-flash
      # Optional: comma-separated origins of a static frontend allowed to use this
      # service as its AI proxy (for example https://dhikr-counter.onrender.com).
      - key: AI_PROXY_ORIGINS
        sync: false
      # Required for any custom OpenAI-compatible provider host that is not in the
      # built-in list. Hostnames only, comma-separated (for example
      # freellmapi-i2u7.onrender.com). Without it the proxy answers host_not_allowed.
      - key: AI_ALLOWED_HOSTS
        sync: false
