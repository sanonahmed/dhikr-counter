    <rect x="-112" y="-112" width="224" height="224" rx="14" transform="rotate(45)" stroke="#D4AF5A" stroke-width="10" fill="none" stroke-opacity="0.88"/>
    <!-- Inner tasbih ring -->
    <circle cx="0" cy="0" r="82" fill="#083B2B" stroke="#E5C77B" stroke-width="6"/>
    <!-- Crescent emblem -->
