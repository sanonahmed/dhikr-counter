<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#0B4F3A"/>
  <rect x="28" y="28" width="456" height="456" rx="90" stroke="#C9A24D" stroke-width="4" stroke-opacity="0.45"/>
  <g transform="translate(256 256)">
